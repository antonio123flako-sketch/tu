<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Flores y Corazones</title>
  <link rel="stylesheet" href="./style.css">

  <style>
    /* Botón bonito */
    .music-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #ff4d6d;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: 0.3s;
    }

    .music-btn:hover {
      background: #ff1e4d;
      transform: scale(1.1);
    }
  </style>
</head>

<body class="container">

  <div class="night"></div>

  <!-- FLORES (tu contenido original resumido aquí, puedes dejar todo igual) -->
  <div class="flowers">
    <!-- aquí va TODO tu código de flores tal como lo tenías -->
  </div>

  <!-- BURBUJAS -->
  <div class="bubbles">
    <div class="bubble">
      <svg class="heart" viewBox="0 0 32 32">
        <path d="M23.6 2c-3.363 0-6.258 2.736-7.599 5.594-1.342-2.858-4.237-5.594-7.601-5.594-4.637 0-8.4 3.764-8.4 8.401 0 9.433 9.516 11.906 16.001 21.232 6.13-9.268 15.999-12.1 15.999-21.232 0-4.637-3.763-8.401-8.4-8.401z"/>
      </svg>
    </div>
  </div>

  <!-- 🎵 AUDIO -->
  <audio id="musica" loop>
    <source src="musica.mp3" type="audio/mpeg">
  </audio>

  <!-- BOTÓN BONITO -->
  <button class="music-btn" onclick="toggleMusic()">
    💖 Música
  </button>

  <!-- SCRIPT -->
  <script src="./script.js"></script>

  <script>
    function toggleMusic() {
      const music = document.getElementById("musica");

      if (music.paused) {
        music.play();
      } else {
        music.pause();
      }
    }
  </script>

</body>
</html>
